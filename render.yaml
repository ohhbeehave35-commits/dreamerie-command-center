services:
  - type: web
    name: dreamerie-command-center
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers makes uvicorn set request.client.host from X-Forwarded-For
    # so per-IP rate limiting sees the real client, not Render's edge proxy.
    # --forwarded-allow-ips=* trusts the header because on Render every request
    # arrives through Render's own proxy; tighten to the trusted edge CIDR if the
    # app is ever exposed to direct (non-proxied) traffic.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste in the Render dashboard, never in git
      - key: ACCESS_CODE
        sync: false          # Susan's dashboard password — paste in Render
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: TTS_VOICE
        value: en-US-AriaNeural
      - key: XAI_API_KEY
        sync: false          # optional: paste to use Grok TTS instead of free voice
      - key: XAI_VOICE
        value: ara            # ara | eve | leo | rex | sal, or a cloned voice_id
      - key: AIRTABLE_TOKEN
        sync: false          # personal access token (pat...) -- Susan's OWN base, not Vinny's
      - key: AIRTABLE_BASE_ID
        sync: false          # paste after creating Susan's own Airtable base (see setup notes)
      - key: SITE_BASE_URL
        value: https://dreamerie-command-center.onrender.com
      - key: OPENAI_API_KEY
        sync: false          # optional: DALL-E image generation
      - key: ELEVENLABS_API_KEY
        sync: false          # optional: premium voice
      - key: VAPID_PUBLIC_KEY
        sync: false          # optional: phone push alerts
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@dreamerie.com
      - key: GMAIL_ADDRESS
        sync: false          # optional: real email sending
      - key: GMAIL_APP_PASSWORD
        sync: false
