<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Set your password - The Dreamerie Command Center</title></head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 44%,#1a1224,#0a0710 74%);font-family:Inter,-apple-system,sans-serif">
<form id="f" style="display:flex;flex-direction:column;gap:14px;align-items:center;padding:36px 40px;background:rgba(20,14,26,0.85);border:1px solid rgba(196,150,230,0.35);border-radius:16px;max-width:calc(100vw - 48px);box-sizing:border-box">
<div style="font-weight:700;font-size:19px;letter-spacing:0.16em;background:linear-gradient(180deg,#e0b8f0,#b87ad9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">THE DREAMERIE</div>
<div style="font-size:11px;letter-spacing:0.4em;color:#c8ccd2">COMMAND CENTER</div>
<div id="intro" style="font-size:13px;color:#c8ccd2;text-align:center;max-width:240px;line-height:1.5">Choose your own password. At least 8 characters, with a number or symbol.</div>
<div id="fields" style="display:flex;flex-direction:column;gap:14px;align-items:center">
<input id="p1" type="password" placeholder="New password" autocomplete="new-password" style="margin-top:6px;padding:11px 14px;font-size:16px;width:220px;max-width:100%;box-sizing:border-box;color:#e6e2d6;background:rgba(26,18,34,0.9);border:1px solid rgba(200,204,210,0.2);border-radius:10px;text-align:center">
<input id="p2" type="password" placeholder="Type it again" autocomplete="new-password" style="padding:11px 14px;font-size:16px;width:220px;max-width:100%;box-sizing:border-box;color:#e6e2d6;background:rgba(26,18,34,0.9);border:1px solid rgba(200,204,210,0.2);border-radius:10px;text-align:center">
<button id="go" type="submit" style="padding:10px 26px;font-weight:600;font-size:14px;background:linear-gradient(180deg,#d9a8ec,#b87ad9);color:#241530;border:none;border-radius:10px;cursor:pointer">Set password</button>
</div>
<a id="signin" href="/" style="display:none;font-size:12px;color:#9aa0aa;text-decoration:none;border-bottom:1px dotted rgba(200,204,210,0.35)">Go to sign in</a>
<div id="m" style="font-size:12px;color:#e0a48f;min-height:16px;text-align:center;max-width:240px"></div>
</form>
<script>
const m = document.getElementById('m');
const token = new URLSearchParams(location.search).get('token') || '';
// Take the token out of the address bar and history once read.
try { history.replaceState(null, '', location.pathname); } catch (e) {}
function dead(msg) {
  document.getElementById('fields').style.display = 'none';
  document.getElementById('intro').style.display = 'none';
  document.getElementById('signin').style.display = 'inline';
  m.textContent = msg;
}
fetch('/api/set-password/check?token=' + encodeURIComponent(token))
  .then(r => r.json().then(j => ({ ok: r.ok, j })))
  .then(x => { if (!x.ok) dead(x.j.detail || 'This link is not valid.'); })
  .catch(() => {});
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const a = document.getElementById('p1').value, b = document.getElementById('p2').value;
  if (a !== b) { m.textContent = 'The two passwords do not match.'; return; }
  if (!a) { m.textContent = 'Enter a password.'; return; }
  m.textContent = 'Saving...';
  const r = await fetch('/api/set-password', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, password: a }) });
  const j = await r.json().catch(() => ({}));
  if (r.ok) {
    document.getElementById('fields').style.display = 'none';
    document.getElementById('intro').style.display = 'none';
    document.getElementById('signin').style.display = 'inline';
    m.style.color = '#b9e0c0';
    m.textContent = j.detail || 'Password set.';
    return;
  }
  m.textContent = j.detail || 'That did not work.';
});
</script>
</body></html>
