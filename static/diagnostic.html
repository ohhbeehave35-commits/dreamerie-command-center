<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a0c" />
<title>System Diagnostic — The Dreamerie Command Center</title>
<style>
  :root {
    --brand: #c9a84c;
    --brand-light: #e6cf88;
    --bg: #0a0a0c;
    --surface: #131310;
    --surface2: #1c1b17;
    --border: rgba(201,168,76,0.18);
    --border-dim: rgba(200,204,210,0.1);
    --text: #e6e2d6;
    --text-muted: #9aa0aa;
    --text-dim: #5f5e57;
    --green: #5a9a6a;
    --green-bg: rgba(90,154,106,0.14);
    --red: #d67560;
    --red-bg: rgba(214,117,96,0.14);
    --yellow: #d8b24a;
    --yellow-bg: rgba(216,178,74,0.14);
    --dim: #4a4a48;
    --dim-bg: rgba(120,120,120,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    min-height: 100dvh;
    line-height: 1.45;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--brand-light);
  }
  h1 small {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .actions { display: flex; gap: 10px; align-items: center; }
  button {
    font: inherit;
    background: var(--brand);
    color: #1a1508;
    border: 0;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--brand-light); }
  button:disabled { opacity: 0.5; cursor: wait; }
  a.back {
    color: var(--text-muted);
    font-size: 13px;
    text-decoration: none;
    padding: 8px 12px;
    border: 1px solid var(--border-dim);
    border-radius: 6px;
  }
  a.back:hover { color: var(--text); border-color: var(--border); }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin: 22px 0 24px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border-dim);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 11px; color: var(--text-dim); letter-spacing: 0.6px; text-transform: uppercase; margin-top: 2px; }
  .stat.ok .n { color: var(--green); }
  .stat.bad .n { color: var(--red); }
  .stat.warn .n { color: var(--yellow); }
  .stat.dim .n { color: var(--text-muted); }

  .banner {
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    border: 1px solid transparent;
  }
  .banner.healthy { background: var(--green-bg); border-color: var(--green); color: var(--text); }
  .banner.partial { background: var(--yellow-bg); border-color: var(--yellow); color: var(--text); }
  .banner.degraded { background: var(--red-bg); border-color: var(--red); color: var(--text); }

  .service {
    background: var(--surface);
    border: 1px solid var(--border-dim);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: center;
  }
  .service .name { font-weight: 600; font-size: 15px; }
  .service .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .service .error {
    grid-column: 1 / -1;
    padding: 10px 12px;
    background: rgba(0,0,0,0.25);
    border-left: 3px solid var(--red);
    border-radius: 4px;
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 12px;
    color: var(--red);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .service .hint {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--text-muted);
    padding-top: 4px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .pill.ok  { background: var(--green-bg); color: var(--green); }
  .pill.bad { background: var(--red-bg); color: var(--red); }
  .pill.warn { background: var(--yellow-bg); color: var(--yellow); }
  .pill.dim { background: var(--dim-bg); color: var(--text-muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .latency { color: var(--text-dim); font-size: 12px; }

  .loading, .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 14px;
  }
  footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border-dim);
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>
    System Diagnostic
    <small>The Dreamerie Command Center</small>
  </h1>
  <div class="actions">
    <a class="back" href="/support">Recent faults</a>
    <a class="back" href="/">← Command Center</a>
    <button id="refresh">Re-run</button>
  </div>
</header>

<div id="banner"></div>

<div class="summary" id="summary"></div>

<div id="services">
  <div class="loading">Running diagnostic probes…</div>
</div>

<footer>
  Raw JSON: <a href="/api/diagnostic" style="color:var(--brand-light)">/api/diagnostic</a>
  &nbsp;·&nbsp; Also available via the assistant: ask her "run the diagnostic"
</footer>

<script>
const $ = (sel) => document.querySelector(sel);
const btn = $('#refresh');

function pill(state, label) {
  return `<span class="pill ${state}"><span class="dot"></span>${label}</span>`;
}

function serviceCard(s) {
  let state, label;
  if (s.ok === true)         { state = 'ok';   label = 'OK'; }
  else if (s.ok === false)   { state = 'bad';  label = 'FAIL'; }
  else if (!s.configured)    { state = 'dim';  label = 'Not configured'; }
  else                       { state = 'warn'; label = 'Configured'; }

  const lat = (s.latency_ms != null) ? `<span class="latency">${s.latency_ms} ms</span>` : '';
  const err = s.error ? `<div class="error">${escapeHtml(s.error)}</div>` : '';
  const hint = s.hint ? `<div class="hint">↳ ${escapeHtml(s.hint)}</div>` : '';

  return `
    <div class="service">
      ${pill(state, label)}
      <div>
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="meta">${s.configured ? 'Configured' : 'Not configured'}${lat ? ' · ' : ''}${lat}</div>
      </div>
      <div></div>
      ${err}
      ${hint}
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function renderSummary(report) {
  const { counts, summary, elapsed_ms } = report;

  const banner = $('#banner');
  const msg = {
    healthy: `All systems healthy · probed in ${elapsed_ms} ms`,
    partial: `Partial coverage — some services aren't configured or weren't actively probed`,
    degraded: `Degraded — ${counts.red} service${counts.red === 1 ? '' : 's'} failing right now`,
  }[summary] || '';
  banner.className = `banner ${summary}`;
  banner.textContent = msg;

  $('#summary').innerHTML = `
    <div class="stat ok"><div class="n">${counts.green}</div><div class="l">OK</div></div>
    <div class="stat bad"><div class="n">${counts.red}</div><div class="l">Failing</div></div>
    <div class="stat warn"><div class="n">${counts.yellow}</div><div class="l">Not probed</div></div>
    <div class="stat dim"><div class="n">${counts.unconfigured}</div><div class="l">Unconfigured</div></div>
  `;
}

async function runDiagnostic() {
  btn.disabled = true;
  btn.textContent = 'Running…';
  $('#services').innerHTML = '<div class="loading">Running diagnostic probes…</div>';
  try {
    const r = await fetch('/api/diagnostic', { credentials: 'same-origin' });
    if (r.status === 401) {
      $('#services').innerHTML = '<div class="empty">Locked — <a href="/" style="color:var(--brand-light)">sign in</a> and retry.</div>';
      return;
    }
    const report = await r.json();
    renderSummary(report);
    // Sort: failing first, then ok, then unprobed, then unconfigured
    const order = (s) => s.ok === false ? 0 : s.ok === true ? 1 : s.configured ? 2 : 3;
    const sorted = [...report.services].sort((a, b) => order(a) - order(b));
    $('#services').innerHTML = sorted.map(serviceCard).join('');
  } catch (e) {
    $('#services').innerHTML = `<div class="empty">Diagnostic call failed: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Re-run';
  }
}

btn.addEventListener('click', runDiagnostic);
runDiagnostic();
</script>
</body>
</html>
